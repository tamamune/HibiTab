<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HibiTab</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon32.png" alt=""><span>HibiTab</span></div>
    <input id="search" type="search" placeholder="タイトル・URLで検索" autocomplete="off">
    <button id="openFull" class="ghost" title="大きな画面で開く">⤢</button>
  </header>
  <nav id="nav">
    <button data-view="open">開いている</button>
    <button data-view="favorites">お気に入り</button>
    <button data-view="frequent">よく見る</button>
    <button data-view="archive">アーカイブ</button>
    <button data-view="report">日報</button>
    <button data-view="settings">設定</button>
  </nav>
  <main id="main"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
